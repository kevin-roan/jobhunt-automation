name: deedy-automation

services:
  app:
    build:
      context: .
      target: runtime
    image: deedy-automation:latest
    container_name: deedy-app
    # "no" (not unless-stopped) so Docker never resurrects this on host boot.
    # Start it deliberately with ./start.sh.
    restart: 'no'
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Reaches the Ollama service below, or the host with host.docker.internal.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Optional mobile companion. These seed the sync settings on first boot;
      # only operational metadata is mirrored, never documents or PII.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_USER_ID: ${SUPABASE_USER_ID:-}
    volumes:
      - deedy-data:/data
    # Chromium needs a larger shared-memory segment than Docker's 64MB default.
    shm_size: '1gb'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/api/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Optional local inference server. Start with: docker compose --profile llm up -d
  ollama:
    image: ollama/ollama:latest
    container_name: deedy-ollama
    profiles: ['llm']
    restart: 'no'
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  deedy-data:
  ollama-models:
